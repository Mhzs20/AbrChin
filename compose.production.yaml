name: abrchin

services:
  db:
    image: postgres:16-alpine
    container_name: abrchin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - abrchin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.35
    networks:
      - abrchin_internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${ABRCHIN_IMAGE:?ABRCHIN_IMAGE must be set}
    container_name: abrchin-web
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3010"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER must be set}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-abrchinlogin}
      KAVENEGAR_ALERT_TEMPLATE: ${KAVENEGAR_ALERT_TEMPLATE:-}
      KAVENEGAR_TIMEOUT_MS: ${KAVENEGAR_TIMEOUT_MS:-8000}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:?PAYMENT_CALLBACK_BASE_URL must be set}
      PAYMENT_BOOTSTRAP_DEFAULT_PROVIDER: ${PAYMENT_BOOTSTRAP_DEFAULT_PROVIDER:-zibal}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-}
      ZIBAL_TIMEOUT_MS: ${ZIBAL_TIMEOUT_MS:-10000}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_TIMEOUT_MS: ${ZARINPAL_TIMEOUT_MS:-10000}
      ADMIN_MOBILES: ${ADMIN_MOBILES:-}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      PARSPACK_ENABLED: ${PARSPACK_ENABLED:-false}
      PARSPACK_API_BASE_URL: ${PARSPACK_API_BASE_URL:-https://my.parspack.com/cserver/api/public/v1}
      PARSPACK_MANAGEMENT_API_BASE_URL: ${PARSPACK_MANAGEMENT_API_BASE_URL:-}
      PARSPACK_PUBLIC_API_BASE_URL: ${PARSPACK_PUBLIC_API_BASE_URL:-}
      PARSPACK_API_TOKEN: ${PARSPACK_API_TOKEN:-}
      PARSPACK_TIMEOUT_MS: ${PARSPACK_TIMEOUT_MS:-15000}
      PARSPACK_PRICE_CURRENCY: ${PARSPACK_PRICE_CURRENCY:-}
      PARSPACK_PRICE_AMOUNT_UNIT: ${PARSPACK_PRICE_AMOUNT_UNIT:-}
      PARSPACK_API_VERSION: ${PARSPACK_API_VERSION:-v1}
      ARVAN_ENABLED: ${ARVAN_ENABLED:-false}
      ARVAN_API_KEY: ${ARVAN_API_KEY:-}
      ARVAN_API_BASE_URL: ${ARVAN_API_BASE_URL:-https://napi.arvancloud.ir/ecc/v1}
      ARVAN_API_VERSION: ${ARVAN_API_VERSION:-v1}
      ARVAN_REGION_CODES: ${ARVAN_REGION_CODES:-}
      ARVAN_TIMEOUT_MS: ${ARVAN_TIMEOUT_MS:-15000}
      ARVAN_GET_ATTEMPTS: ${ARVAN_GET_ATTEMPTS:-3}
      ARVAN_MUTATIONS_ENABLED: ${ARVAN_MUTATIONS_ENABLED:-false}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-300000}
      INFRASTRUCTURE_PROVIDER_MODE: ${INFRASTRUCTURE_PROVIDER_MODE:-parspack}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.80
    networks:
      - abrchin_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    image: ${ABRCHIN_IMAGE:?ABRCHIN_IMAGE must be set}
    container_name: abrchin-worker
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["./scripts/worker-entrypoint.sh"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER must be set}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-abrchinlogin}
      KAVENEGAR_ALERT_TEMPLATE: ${KAVENEGAR_ALERT_TEMPLATE:-}
      KAVENEGAR_TIMEOUT_MS: ${KAVENEGAR_TIMEOUT_MS:-8000}
      ADMIN_MOBILES: ${ADMIN_MOBILES:-}
      PARSPACK_ENABLED: ${PARSPACK_ENABLED:-false}
      PARSPACK_API_BASE_URL: ${PARSPACK_API_BASE_URL:-https://my.parspack.com/cserver/api/public/v1}
      PARSPACK_MANAGEMENT_API_BASE_URL: ${PARSPACK_MANAGEMENT_API_BASE_URL:-}
      PARSPACK_PUBLIC_API_BASE_URL: ${PARSPACK_PUBLIC_API_BASE_URL:-}
      PARSPACK_API_TOKEN: ${PARSPACK_API_TOKEN:-}
      PARSPACK_TIMEOUT_MS: ${PARSPACK_TIMEOUT_MS:-15000}
      PARSPACK_PRICE_CURRENCY: ${PARSPACK_PRICE_CURRENCY:-}
      PARSPACK_PRICE_AMOUNT_UNIT: ${PARSPACK_PRICE_AMOUNT_UNIT:-}
      PARSPACK_API_VERSION: ${PARSPACK_API_VERSION:-v1}
      ARVAN_ENABLED: ${ARVAN_ENABLED:-false}
      ARVAN_API_KEY: ${ARVAN_API_KEY:-}
      ARVAN_API_BASE_URL: ${ARVAN_API_BASE_URL:-https://napi.arvancloud.ir/ecc/v1}
      ARVAN_API_VERSION: ${ARVAN_API_VERSION:-v1}
      ARVAN_REGION_CODES: ${ARVAN_REGION_CODES:-}
      ARVAN_TIMEOUT_MS: ${ARVAN_TIMEOUT_MS:-15000}
      ARVAN_GET_ATTEMPTS: ${ARVAN_GET_ATTEMPTS:-3}
      ARVAN_MUTATIONS_ENABLED: ${ARVAN_MUTATIONS_ENABLED:-false}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-300000}
      INFRASTRUCTURE_PROVIDER_MODE: ${INFRASTRUCTURE_PROVIDER_MODE:-parspack}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
      WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-60000}
      WORKER_ID: ${WORKER_ID:-provisioning-worker}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    networks:
      - abrchin_internal
    healthcheck:
      test: ["CMD", "node", "scripts/worker-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  abrchin_internal:
    name: abrchin_internal

volumes:
  abrchin_pg_data:
    name: abrchin_pg_data
