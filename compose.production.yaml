name: abrchin

x-file-secrets: &file-secrets
  ABRCHIN_REQUIRE_FILE_SECRETS: ${ABRCHIN_REQUIRE_FILE_SECRETS:-true}
  ABRCHIN_SECRET_FILE_UID: ${ABRCHIN_SECRET_FILE_UID:-1001}
  DATABASE_URL_FILE: /run/secrets/abrchin-service/database-url
  SESSION_SECRET_FILE: /run/secrets/abrchin-service/session-secret
  CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/abrchin-service/credential-encryption-key
  KAVENEGAR_API_KEY_FILE: /run/secrets/abrchin-service/kavenegar-api-key
  ARVAN_API_KEY_FILE: /run/secrets/abrchin-service/arvan-api-key
  MESSAGEGO_CLIENT_SECRET_FILE: /run/secrets/abrchin-service/messagego-client-secret

services:
  db:
    image: postgres:16.10-alpine
    container_name: abrchin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - abrchin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.35
    networks:
      - abrchin_internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    image: ${ABRCHIN_IMAGE:?ABRCHIN_IMAGE must be set}
    container_name: abrchin-web
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3010"
      # Explicit migration gate lives in ops/deploy.sh. Keep false in steady state.
      ABRCHIN_RUN_MIGRATE_ON_START: ${ABRCHIN_RUN_MIGRATE_ON_START:-false}
      <<: *file-secrets
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER must be set}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-abrchinlogin}
      KAVENEGAR_ALERT_TEMPLATE: ${KAVENEGAR_ALERT_TEMPLATE:-}
      KAVENEGAR_TIMEOUT_MS: ${KAVENEGAR_TIMEOUT_MS:-8000}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL:?PAYMENT_CALLBACK_BASE_URL must be set}
      PAYMENT_BOOTSTRAP_DEFAULT_PROVIDER: ${PAYMENT_BOOTSTRAP_DEFAULT_PROVIDER:-zibal}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-}
      ZIBAL_TIMEOUT_MS: ${ZIBAL_TIMEOUT_MS:-10000}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-false}
      ZARINPAL_TIMEOUT_MS: ${ZARINPAL_TIMEOUT_MS:-10000}
      ADMIN_MOBILES: ${ADMIN_MOBILES:-}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-120}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MESSAGEGO_BASE_URL: ${MESSAGEGO_BASE_URL:-}
      MESSAGEGO_CLIENT_ID: ${MESSAGEGO_CLIENT_ID:-}
      MESSAGEGO_TENANT_ID: ${MESSAGEGO_TENANT_ID:-}
      MESSAGEGO_WORKSPACE_ID: ${MESSAGEGO_WORKSPACE_ID:-}
      MESSAGEGO_TIMEOUT_MS: ${MESSAGEGO_TIMEOUT_MS:-15000}
      MESSAGEGO_SETTLEMENT_ENABLED: ${MESSAGEGO_SETTLEMENT_ENABLED:-false}
      MESSAGEGO_CUSTOMER_AI_ENABLED: ${MESSAGEGO_CUSTOMER_AI_ENABLED:-false}
      MESSAGEGO_SECRET_HANDOFF_ENABLED: ${MESSAGEGO_SECRET_HANDOFF_ENABLED:-false}
      MESSAGEGO_S2S_KEYRING_FILE: /run/secrets/abrchin-service/messagego-to-abrchin-keyring.json
      MESSAGEGO_S2S_SIGNING_KEYRING_FILE: /run/secrets/abrchin-service/abrchin-to-messagego-keyring.json
      MESSAGEGO_S2S_SIGNING_SERVICE_ID: ${MESSAGEGO_S2S_SIGNING_SERVICE_ID:-abrchin}
      MESSAGEGO_S2S_ALLOWED_SERVICE_IDS: ${MESSAGEGO_S2S_ALLOWED_SERVICE_IDS:-}
      MESSAGEGO_S2S_MAX_CLOCK_SKEW_SECONDS: ${MESSAGEGO_S2S_MAX_CLOCK_SKEW_SECONDS:-300}
      MESSAGEGO_HANDOFF_BASE_URL: ${MESSAGEGO_HANDOFF_BASE_URL:-}
      MESSAGEGO_HANDOFF_PATH: ${MESSAGEGO_HANDOFF_PATH:-/internal/v2/handoff}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER must be set}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      EMAIL_VERIFICATION_TTL_SECONDS: ${EMAIL_VERIFICATION_TTL_SECONDS:-600}
      PUBLIC_SALE_ENABLED: ${PUBLIC_SALE_ENABLED:-true}
      ARVAN_ENABLED: ${ARVAN_ENABLED:-false}
      ARVAN_API_BASE_URL: ${ARVAN_API_BASE_URL:-https://napi.arvancloud.ir/ecc/v1}
      ARVAN_API_VERSION: ${ARVAN_API_VERSION:-v1}
      ARVAN_REGION_CODES: ${ARVAN_REGION_CODES:-}
      ARVAN_TIMEOUT_MS: ${ARVAN_TIMEOUT_MS:-15000}
      ARVAN_GET_ATTEMPTS: ${ARVAN_GET_ATTEMPTS:-3}
      ARVAN_PUBLIC_SALE_ENABLED: ${ARVAN_PUBLIC_SALE_ENABLED:-true}
      ARVAN_READY_PUBLIC_SALE_ENABLED: ${ARVAN_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_CLOUD_PUBLIC_SALE_ENABLED: ${ARVAN_CLOUD_PUBLIC_SALE_ENABLED:-true}
      MANUAL_READY_PUBLIC_SALE_ENABLED: ${MANUAL_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_MUTATIONS_ENABLED: ${ARVAN_MUTATIONS_ENABLED:-false}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-300000}
      INFRASTRUCTURE_PROVIDER_MODE: ${INFRASTRUCTURE_PROVIDER_MODE:-mock}
    volumes:
      - ${ABRCHIN_SERVICE_SECRET_ROOT:-/srv/abrchin/secrets/service}:/run/secrets/abrchin-service:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.80
    networks:
      - abrchin_internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  worker:
    image: ${ABRCHIN_IMAGE:?ABRCHIN_IMAGE must be set}
    container_name: abrchin-worker
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["./scripts/worker-entrypoint.sh"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      <<: *file-secrets
      SMS_PROVIDER: ${SMS_PROVIDER:?SMS_PROVIDER must be set}
      KAVENEGAR_TEMPLATE: ${KAVENEGAR_TEMPLATE:-abrchinlogin}
      KAVENEGAR_ALERT_TEMPLATE: ${KAVENEGAR_ALERT_TEMPLATE:-}
      KAVENEGAR_TIMEOUT_MS: ${KAVENEGAR_TIMEOUT_MS:-8000}
      ADMIN_MOBILES: ${ADMIN_MOBILES:-}
      PUBLIC_SALE_ENABLED: ${PUBLIC_SALE_ENABLED:-true}
      ARVAN_ENABLED: ${ARVAN_ENABLED:-false}
      ARVAN_API_BASE_URL: ${ARVAN_API_BASE_URL:-https://napi.arvancloud.ir/ecc/v1}
      ARVAN_API_VERSION: ${ARVAN_API_VERSION:-v1}
      ARVAN_REGION_CODES: ${ARVAN_REGION_CODES:-}
      ARVAN_TIMEOUT_MS: ${ARVAN_TIMEOUT_MS:-15000}
      ARVAN_GET_ATTEMPTS: ${ARVAN_GET_ATTEMPTS:-3}
      ARVAN_PUBLIC_SALE_ENABLED: ${ARVAN_PUBLIC_SALE_ENABLED:-true}
      ARVAN_READY_PUBLIC_SALE_ENABLED: ${ARVAN_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_CLOUD_PUBLIC_SALE_ENABLED: ${ARVAN_CLOUD_PUBLIC_SALE_ENABLED:-true}
      MANUAL_READY_PUBLIC_SALE_ENABLED: ${MANUAL_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_MUTATIONS_ENABLED: ${ARVAN_MUTATIONS_ENABLED:-false}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-300000}
      INFRASTRUCTURE_PROVIDER_MODE: ${INFRASTRUCTURE_PROVIDER_MODE:-mock}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-120000}
      WORKER_STALE_AFTER_MS: ${WORKER_STALE_AFTER_MS:-60000}
      WORKER_ID: ${WORKER_ID:-provisioning-worker}
      BILLING_WORKER_INTERVAL_MS: ${BILLING_WORKER_INTERVAL_MS:-60000}
    volumes:
      - ${ABRCHIN_SERVICE_SECRET_ROOT:-/srv/abrchin/secrets/service}:/run/secrets/abrchin-service:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.25
    networks:
      - abrchin_internal
    healthcheck:
      test:
        - CMD-SHELL
        - . ./scripts/export-file-secrets.sh && abrchin_export_runtime_secrets && node scripts/worker-healthcheck.mjs
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  catalog-sync:
    image: ${ABRCHIN_IMAGE:?ABRCHIN_IMAGE must be set}
    container_name: abrchin-catalog-sync
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    command: ["./scripts/catalog-sync-entrypoint.sh"]
    environment:
      NODE_ENV: production
      <<: *file-secrets
      PUBLIC_SALE_ENABLED: ${PUBLIC_SALE_ENABLED:-true}
      ARVAN_ENABLED: ${ARVAN_ENABLED:-false}
      ARVAN_API_BASE_URL: ${ARVAN_API_BASE_URL:-https://napi.arvancloud.ir/ecc/v1}
      ARVAN_API_VERSION: ${ARVAN_API_VERSION:-v1}
      ARVAN_REGION_CODES: ${ARVAN_REGION_CODES:-}
      ARVAN_TIMEOUT_MS: ${ARVAN_TIMEOUT_MS:-15000}
      ARVAN_GET_ATTEMPTS: ${ARVAN_GET_ATTEMPTS:-3}
      ARVAN_PUBLIC_SALE_ENABLED: ${ARVAN_PUBLIC_SALE_ENABLED:-true}
      ARVAN_READY_PUBLIC_SALE_ENABLED: ${ARVAN_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_CLOUD_PUBLIC_SALE_ENABLED: ${ARVAN_CLOUD_PUBLIC_SALE_ENABLED:-true}
      MANUAL_READY_PUBLIC_SALE_ENABLED: ${MANUAL_READY_PUBLIC_SALE_ENABLED:-true}
      ARVAN_MUTATIONS_ENABLED: ${ARVAN_MUTATIONS_ENABLED:-false}
      CATALOG_SYNC_INTERVAL_MS: ${CATALOG_SYNC_INTERVAL_MS:-300000}
    volumes:
      - ${ABRCHIN_SERVICE_SECRET_ROOT:-/srv/abrchin/secrets/service}:/run/secrets/abrchin-service:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.15
    networks:
      - abrchin_internal
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  abrchin_internal:
    name: abrchin_internal

volumes:
  abrchin_pg_data:
    name: abrchin_pg_data
