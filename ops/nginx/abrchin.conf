server {
    listen 80;
    listen [::]:80;
    server_name abrchin.ir www.abrchin.ir;

    client_max_body_size 2m;

    # Prefer outer TLS terminator's forwarded proto when present; otherwise $scheme.
    # App trusts these only when TRUSTED_PROXY_HOPS matches the known proxy chain.
    set $abrchin_forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $abrchin_forwarded_proto $http_x_forwarded_proto;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite client-supplied forwarding headers with proxy-controlled values.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $abrchin_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'" always;
    # HSTS for HTTPS edge. When TLS terminates on an outer proxy, that layer
    # should also emit HSTS; this remains safe when this vhost is HTTPS-facing.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
